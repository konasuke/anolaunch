<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src data:">
  <title>Launcher</title>
  <style>
    /* 高さは中身で決まる。窓の高さは renderer.js が測ってメインプロセスに伝える */
    html, body { margin: 0; background: #1e1e1e; color: #fff; font-family: system-ui, sans-serif; }
    body { padding: 16px; box-sizing: border-box; }
    input {
      display: block; width: 100%; font-size: 24px; color: #fff; background: transparent;
      border: none; outline: none; margin: 0; padding: 0;
    }
    input::placeholder { color: #888; }
    ul { list-style: none; margin: 0; padding: 0; max-height: 340px; overflow-y: auto; }
    ul:not(:empty) { margin-top: 12px; }
    li { display: flex; align-items: center; gap: 12px; padding: 6px 8px; font-size: 16px; border-top: 1px solid #333; border-radius: 4px; }
    li img { width: 24px; height: 24px; flex-shrink: 0; }
    li img:not([src]) { visibility: hidden; } /* アイコンがなくても、名前の位置を揃える */
    li .kind { margin-left: auto; padding-left: 12px; font-size: 12px; color: #888; white-space: nowrap; }
    li.selected { background: #3a3a3a; }
  </style>
</head>
<body>
  <input id="query" type="text" autofocus>
  <ul id="results"></ul>
  <script src="renderer.js"></script>
</body>
</html>
