<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>Settings</title>
  <style>
    html, body { margin: 0; background: #1e1e1e; color: #fff; font-family: system-ui, sans-serif; font-size: 14px; }
    body { padding: 24px; box-sizing: border-box; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 0; border-bottom: 1px solid #333; }
    .row:last-child { border-bottom: none; }
    .label { flex-shrink: 0; }
    .control { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; min-width: 0; }
    .control-line { display: flex; align-items: center; gap: 8px; }
    select, button {
      font: inherit; color: #fff; background: #2d2d2d; border: 1px solid #444; border-radius: 6px; padding: 6px 12px; cursor: pointer;
    }
    select:focus, button:focus-visible, input[type=checkbox]:focus-visible { outline: 2px solid #4f8cf0; outline-offset: 1px; }
    #hotkey { min-width: 200px; text-align: center; }
    #hotkey.recording { border-color: #4f8cf0; color: #9bbcf7; }
    #reset { color: #aaa; padding: 6px 8px; background: transparent; border-color: transparent; }
    #reset:hover { color: #fff; }
    input[type=checkbox] { width: 18px; height: 18px; accent-color: #4f8cf0; cursor: pointer; }
    .error { font-size: 12px; color: #f08a8a; text-align: right; max-width: 260px; }
    .error:empty { display: none; }
  </style>
</head>
<body>
  <div class="row">
    <div class="label" id="language-label"></div>
    <div class="control">
      <select id="language"></select>
    </div>
  </div>
  <div class="row">
    <div class="label" id="hotkey-label"></div>
    <div class="control">
      <div class="control-line">
        <button id="reset" type="button"></button>
        <button id="hotkey" type="button"></button>
      </div>
      <div class="error" id="hotkey-error"></div>
    </div>
  </div>
  <div class="row">
    <label class="label" for="autostart" id="autostart-label"></label>
    <div class="control">
      <input id="autostart" type="checkbox">
    </div>
  </div>
  <script src="settings.js"></script>
</body>
</html>
